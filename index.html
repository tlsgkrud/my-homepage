<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>신하경</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
  body {
    margin: 0;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: url("character.png") center center / cover no-repeat;
    color: #fff;
    font-family: "Jua", "Malgun Gothic", sans-serif;
  }
  .cover {
    text-align: center;
    padding: 1.8rem 3.5rem;
    background: #ff5da2;
    border: 5px solid #fff;
    border-radius: 24px;
    box-shadow: 0 10px 0 rgba(0,0,0,0.25);
    transform: rotate(-2deg);
  }
  h1 {
    font-size: 3.4rem;
    margin: 0 0 0.3rem;
    color: #fffbea;
    -webkit-text-stroke: 2px #ff8a00;
    text-shadow: 4px 4px 0 #ff8a00;
    letter-spacing: 2px;
  }
  h1::after {
    content: " 🐾";
    -webkit-text-stroke: 0;
  }
  p {
    font-size: 1.3rem;
    color: #fff;
    margin: 0;
    background: #ff8a00;
    display: inline-block;
    padding: 0.2rem 1rem;
    border-radius: 999px;
  }
</style>
</head>
<body>
  <div class="cover">
    <h1>신하경</h1>
    <p>건양대학교 심리상담치료학과</p>
  </div>
</body>
</html>
