<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>신하경</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@700&display=swap" rel="stylesheet">
<style>
  body {
    margin: 0;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: url("character.png") center center / cover no-repeat;
    color: #fff;
    font-family: "Gaegu", "Malgun Gothic", sans-serif;
  }
  .cover {
    text-align: center;
    padding: 2rem 3rem;
    background: rgba(255, 182, 193, 0.45);
    border: 4px dashed #fff5f7;
    border-radius: 30px;
  }
  h1 {
    font-size: 3rem;
    margin: 0 0 0.5rem;
    text-shadow: 2px 2px 0 rgba(0,0,0,0.15);
  }
  h1::after {
    content: " 🐾";
  }
  p {
    font-size: 1.4rem;
    color: #fff0f3;
    margin: 0;
  }
</style>
</head>
<body>
  <div class="cover">
    <h1>신하경</h1>
    <p>건양대학교 심리상담치료학과</p>
  </div>
</body>
</html>
